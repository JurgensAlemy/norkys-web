name: CI/CD - Validación, Formateo y Despliegue

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---- ETAPA 1: INTEGRACIÓN CONTINUA (CI) Y AUTO-COMMIT ----
  validar_y_formatear:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mostrar información del Commit
        run: |
          echo "El commit fue realizado por: ${{ github.actor }}"
          echo "Mensaje original: ${{ github.event.head_commit.message }}"

      - name: Instalar y ejecutar Prettier
        run: |
          npm install -g prettier
          prettier --write "**/*.{html,css,js}"

      - name: Guardar cambios ordenados (Auto-commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Código formato automático por GitHub Actions"
          branch: ${{ github.ref_name }}

      - name: Validar sintaxis final
        uses: super-linter/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JAVASCRIPT_ES: true
          DISABLE_ERRORS: true

  # ---- ETAPA 2: DESPLIEGUE CONTINUO (CD) ----
  desplegar:
    needs: validar_y_formatear
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      # CORRECCIÓN: Volvemos a descargar el repositorio para asegurar que traiga lo que el bot guardó
      - name: Clonar el repositorio actualizado
        uses: actions/checkout@v4
        with:
          ref: main

      # Forzar la limpieza de cualquier artefacto previo duplicado en el entorno local de la máquina
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir archivos a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Desplegar en vivo
        id: deployment
        uses: actions/deploy-pages@v4
