name: CI/CD - Validación, Formateo y Despliegue

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---- ETAPA 1: INTEGRACIÓN CONTINUA (CI) Y AUTO-COMMIT ----
  validar_y_formatear:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mostrar información del Commit
        run: |
          echo "El commit fue realizado por: ${{ github.actor }}"
          echo "Mensaje original: ${{ github.event.head_commit.message }}"

      # Instala Prettier directamente usando Node.js (Herramienta estándar de la industria)
      - name: Instalar y ejecutar Prettier
        run: |
          npm install -g prettier
          prettier --write "**/*.{html,css,js}"

      # El Auto-Commit mágico si Prettier ordenó algo
      - name: Guardar cambios ordenados (Auto-commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Bot: Código formateado automáticamente por GitHub Actions"
          branch: ${{ github.ref_name }}

      # Validación final de sintaxis
      - name: Validar sintaxis final
        uses: super-linter/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JAVASCRIPT_ES: true
          DISABLE_ERRORS: true

  # ---- ETAPA 2: DESPLIEGUE CONTINUO (CD) ----
  desplegar:
    needs: validar_y_formatear
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir archivos a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Desplegar en vivo
        uses: actions/deploy-pages@v4
