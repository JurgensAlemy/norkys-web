<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido Confirmado - Norky's</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/checkout.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="imgs/logoNorkys.png" />
  </head>

  <body class="checkout-body">
    <div id="header-placeholder"></div>

    <main class="confirmation-wrapper">
      <div class="confirmation-box">
        <div class="confirmation-icon"><i class="fa-solid fa-check"></i></div>
        <h1>¡Pedido Confirmado!</h1>
        <p>
          Hemos recibido tu pedido y ya está en preparación. Te avisaremos
          cuando esté en camino.
        </p>

        <div class="confirmation-code-box">
          <span>Código de pedido</span>
          <strong id="confirm-codigo">—</strong>
        </div>

        <div class="confirmation-meta">
          <div>
            <span>Método de pago</span>
            <strong id="confirm-metodo">—</strong>
          </div>
          <div>
            <span>Tiempo estimado</span>
            <strong>30 - 45 min</strong>
          </div>
        </div>

        <div class="confirmation-actions">
          <a href="rastreo.html" class="btn-confirm-primary"
            ><i class="fa-solid fa-location-dot"></i> Rastrear mi pedido</a
          >
          <a href="profile.html" class="btn-confirm-secondary"
            ><i class="fa-solid fa-receipt"></i> Ver mis pedidos</a
          >
          <a href="menu.html" class="btn-confirm-secondary"
            ><i class="fa-solid fa-utensils"></i> Seguir comprando</a
          >
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/db.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const codigo = params.get("codigo");
        const metodo = params.get("metodo");
        if (codigo)
          document.getElementById("confirm-codigo").textContent = codigo;
        if (metodo)
          document.getElementById("confirm-metodo").textContent = metodo;
      });
    </script>
  </body>
</html>
